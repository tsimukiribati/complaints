<title>MOE Complaints Desk</title>
<!-- Short link for staff: https://complaints.moe.gov.ki/desk
     It forwards to the Staff desk. If the Staff desk link ever changes (for example after the
     handover to the Complaints Officer), replace the link in the TWO places marked DESK LINK below. -->
<meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/moe.gov.ki/s/AKfycby1GwX-HoQhHUiVLaO8XFekGG6mVWvY1is12ely88RY_di3h_GZ9zJHgHQLYv0nYnvVMg/exec"><!-- DESK LINK 1 -->
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F3F5F9;color:#1B1F27;font-family:Arial,Helvetica,sans-serif}
  .card{background:#fff;border-top:4px solid #C00000;border-radius:12px;padding:28px 32px;max-width:440px;margin:16px;text-align:center;box-shadow:0 4px 16px rgba(31,56,100,.08)}
  h1{color:#1F3864;font-size:22px;margin:0 0 8px}
  p{margin:0 0 18px;line-height:1.45}
  a.btn{display:inline-block;background:#1F3864;color:#fff;padding:12px 20px;border-radius:9px;text-decoration:none;font-weight:700}
  small{display:block;margin-top:16px;color:#5F6779}
</style>

<body>
<div class="card">
  <h1>MOE Complaints Desk</h1>
  <p>Opening the desk. If Google asks, sign in with your own MOE email.</p>
  <a class="btn" id="go" href="https://script.google.com/a/macros/moe.gov.ki/s/AKfycby1GwX-HoQhHUiVLaO8XFekGG6mVWvY1is12ely88RY_di3h_GZ9zJHgHQLYv0nYnvVMg/exec">Open the Complaints Desk</a><!-- DESK LINK 2 -->
  <small>For Ministry of Education staff only. Need help? Call 75228090 or email tsimu@moe.gov.ki.</small>
</div>
<script>location.replace(document.getElementById('go').href);</script>
</body>
