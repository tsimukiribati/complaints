<style>
  :root{--navy:#1F3864;--red:#C00000;--ink:#161A22;--ink-2:#3E4657;--muted:#5D6578;--line:#CFD6E2;--bg:#F3F5F9;--ok:#1E7A46;--ok-bg:#E6F3EB;--sel:#E9EFFA}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:1.5}
  .wrap{max-width:620px;margin:0 auto;padding:0 16px}
  .gov{background:#fff}
  .gov .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;padding-bottom:10px}
  .gov img{width:56px;height:56px;flex:0 0 56px}
  .gov-text{text-align:center;flex:1}
  .gov-text .g1{font-size:clamp(9px,2.8vw,11px);letter-spacing:.1em;color:var(--navy);white-space:nowrap}
  .gov-text .g2{font-size:clamp(13px,4.2vw,18px);font-weight:700;letter-spacing:.03em;color:var(--navy);white-space:nowrap}
  .rule{height:4px;background:var(--red)}
  .demo{background:#FFF4E5;border-bottom:1px solid #F0D3A8;color:#6A4A12;font-size:14px}
  .demo.off{background:#FDECEC;border-color:#F2B8B8;color:#7A1010;font-weight:700}
  .demo .wrap{padding-top:8px;padding-bottom:8px}
  main{padding:18px 0 30px}
  .langrow{text-align:right;margin-bottom:6px}
  .langrow button{font:inherit;font-size:15px;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:999px;padding:6px 14px;cursor:pointer}
  h1{font-size:27px;line-height:1.2;margin:0 0 8px;color:var(--navy)}
  h2{font-size:23px;line-height:1.25;margin:0 0 6px;color:var(--navy)}
  .lead{margin:0 0 18px;color:var(--ink-2)}
  .hint{font-size:16px;color:var(--muted);margin:0 0 12px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px}
  [hidden]{display:none!important}

  .big{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:20px;font-weight:700;color:var(--navy);
       background:#fff;border:2px solid var(--navy);border-radius:14px;padding:18px;margin-bottom:12px;cursor:pointer;min-height:76px}
  .big .ic{flex:0 0 46px;height:46px;border-radius:50%;background:var(--sel);display:grid;place-items:center}
  .big .ic svg{width:24px;height:24px;stroke:var(--navy);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .big small{display:block;font-size:15px;font-weight:400;color:var(--muted);margin-top:2px}
  .big.primary{background:var(--navy);color:#fff}
  .big.primary small{color:#D7DEEE}
  .big.primary .ic{background:rgba(255,255,255,.15)}
  .big.primary .ic svg{stroke:#fff}
  .helpbox{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:16px;color:var(--ink-2)}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .back{font:inherit;font-size:17px;font-weight:700;border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:10px;padding:8px 14px;cursor:pointer;min-height:44px}
  .stepno{margin-left:auto;font-size:15px;color:var(--muted);font-weight:700}
  .bar{height:8px;background:#DCE1EA;border-radius:4px;margin-bottom:16px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--navy);border-radius:4px;transition:width .2s}

  .opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:18px;color:var(--ink);background:#fff;
       border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;min-height:60px}
  .opt .dot{flex:0 0 24px;height:24px;border-radius:50%;border:2px solid #8C96AA;display:grid;place-items:center}
  .opt[aria-pressed="true"]{border-color:var(--navy);background:var(--sel);font-weight:700}
  .opt[aria-pressed="true"] .dot{border-color:var(--navy)}
  .opt[aria-pressed="true"] .dot::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--navy)}
  .opt small{display:block;font-size:15px;color:var(--muted);font-weight:400}
  .more{margin:4px 0 14px 4px;padding:12px;border-left:4px solid var(--navy);background:#fff;border-radius:0 10px 10px 0}

  label.lbl{display:block;font-weight:700;margin-bottom:6px}
  .optl{font-weight:400;color:var(--muted)}
  input[type=text],input[type=tel],input[type=email],select,textarea{width:100%;font:inherit;font-size:18px;color:var(--ink);background:#fff;
       border:2px solid #AEB7C8;border-radius:10px;padding:12px;min-height:54px}
  textarea{min-height:190px;resize:vertical}
  input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid #9DB4E0;outline-offset:1px;border-color:var(--navy)}
  .field{margin-bottom:16px}
  .tips{margin:0 0 10px;padding-left:22px;color:var(--ink-2);font-size:16px}
  .err{color:var(--red);font-weight:700;font-size:16px;margin:4px 0 10px}
  .next{font:inherit;font-size:20px;font-weight:700;width:100%;border:0;border-radius:12px;background:var(--navy);color:#fff;padding:16px;min-height:62px;cursor:pointer;margin-top:8px}
  .next[disabled]{opacity:.6;cursor:wait}
  .ghostbtn{font:inherit;font-size:17px;font-weight:700;width:100%;border:2px solid var(--navy);border-radius:12px;background:#fff;color:var(--navy);padding:13px;min-height:56px;cursor:pointer;margin-top:10px}
  .photo-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .photo-row img{width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
  .filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--navy);border-radius:10px;padding:10px 16px;color:var(--navy);font-weight:700;background:#fff;min-height:50px}
  .filebtn input{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
  .linkbtn{border:0;background:none;color:var(--navy);text-decoration:underline;font:inherit;font-size:16px;cursor:pointer;padding:8px 4px}

  .review{border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
  .review div{padding:12px 14px;border-top:1px solid var(--line)}
  .review div:first-child{border-top:0}
  .review dt{color:var(--muted);font-size:15px}
  .review dd{margin:0;white-space:pre-wrap;word-break:break-word;font-weight:700}
  .consent{display:flex;gap:12px;align-items:flex-start;background:#F7F8FB;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:17px;cursor:pointer}
  .consent input{width:26px;height:26px;flex:0 0 26px;margin-top:1px;accent-color:var(--navy)}
  .alert{background:#FDECEC;border:1px solid #F2B8B8;color:#7A1010;border-radius:10px;padding:12px;font-size:16px;margin-top:12px}
  .notice{background:#EEF3FB;border:1px solid #CCD8EE;border-radius:10px;padding:10px 12px;font-size:15px;margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}

  .done{text-align:center}
  .tick{width:64px;height:64px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:4px auto 10px;font-size:34px;font-weight:700}
  .refbox{border:3px dashed var(--navy);border-radius:12px;padding:14px;margin:0 0 10px}
  .refbox .k{font-size:16px;color:var(--muted)}
  .refbox .v{white-space:nowrap;font-size:clamp(21px,7.4vw,30px);font-weight:700;letter-spacing:.04em;color:var(--navy);font-family:"Courier New",monospace}
  .done ul{text-align:left;padding-left:22px;font-size:17px}

  .prog{display:flex;list-style:none;padding:0;margin:14px 0 8px;gap:4px}
  .prog li{flex:1;text-align:center;font-size:13px;color:var(--muted)}
  .prog li i{display:block;height:8px;border-radius:4px;background:#DCE1EA;margin-bottom:6px}
  .prog li.on{color:var(--navy);font-weight:700}
  .prog li.on i{background:var(--navy)}
  .chip{display:inline-block;font-size:15px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--sel);color:var(--navy)}
  .chip.ok{background:var(--ok-bg);color:var(--ok)}
  .updates{list-style:none;padding:0;margin:8px 0 0}
  .updates li{border-left:4px solid var(--navy);padding:4px 0 8px 12px;margin-bottom:10px}
  .updates small{color:var(--muted);display:block}
  footer{border-top:1px solid var(--line);background:#fff;color:var(--ink-2);font-size:15px}
  footer .wrap{padding-top:14px;padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px))}
  footer b{color:var(--navy)}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
  img,select,input,textarea{max-width:100%}
  .opt span,.big span{min-width:0;overflow-wrap:anywhere}
  @media (max-width:380px){ body{font-size:17px} .gov img{width:44px;height:44px;flex-basis:44px} .big{font-size:18px;padding:15px} .card{padding:16px 13px} }
  @media (max-width:340px){ .wrap{padding:0 10px} .gov img{width:38px;height:38px;flex-basis:38px} .gov-text .g2{font-size:12px} .gov-text .g1{font-size:8.5px} h1{font-size:24px} h2{font-size:21px} .big .ic{flex-basis:38px;height:38px} .opt{padding:12px 10px} }
  @media (min-width:700px){ main{padding-top:28px} }
</style>
</head>

<script>
/* =========================================================================
   MOE COMPLAINTS REGISTER: customer page (for GitHub Pages)
   Ministry of Education, Kiribati. TSIMU, version 1.0, November 2026.
   South Tarawa offices. One question per screen, big buttons, plain words.

   ONE THING TO CHANGE: paste the "Public intake" web app link from Apps Script

const CONFIG = {

  HELP_PHONE: '75228090',
  HELP_EMAIL: 'tsimu@moe.gov.ki'

const BUILD = 'live';   /* live or demo */

/* These lists load from the Google Sheet (Lists tab) when the page is connected. */
let OFFICES = ['MOE Headquarters, Bikenibeu', 'Kiribati Teachers College (KTC)', 'Kiribati National Library and Archives (KNLA)'];
let CATEGORIES = ['Waited too long or slow service', 'No reply to my letter or request', 'Rude or unhelpful staff',

const SCHOOLS = ["KJSS006 Betio JSS","KJSS007 TUC1 JSS","KJSS008 Animarao JSS/ TUC2 JSS","KJSS025 Ngaon te Rabakau","KPS030 Bareaumai Primary School","KPS031 Tabontemaneaba Primary School","KPS032 Bikenibeu West Primary School","KPS033 War Memorial Primary School","KPS034 Tebwanimwaneka Primary School","KPS035 Abaunamou Primary School","KPS036 Taakeni Bairiki Primary School","KPS037 Dai Nippon Primary School","KPS038 Temwanoku Primary School","KPS039 St John Bosco Primary School","KPS090 Rurubao","KPS094 Temaiku Sunrise Primary School","KSSS001 King George V & Elaine Bernacchi","KSSS007 St.Louis High School","KSSS009 Moroni High School","KSSS011 Sacred Heart High School","KSSS013 Church of God High School","KSSS014 William Goward Memorial School","KSSS018 St. Patrick College","KSSS020 Santa Maria"];
const URGENT_CATEGORIES = ['A student is unsafe or at risk'];

/* All words on the page. A Gilbertese version can be added as TEXT.gil with the same keys.
   It must be written or checked by a fluent colleague. The language button appears once TEXT.gil exists. */
const TEXT = {
 en: {

  p1:'Received', p2:'Reviewed', p3:'Being handled', p4:'Solved',
  e1:'Please tap where this happened.', e1s:'Please choose the school.',
  e2:'Please tap what your complaint is about.', e3:'Please write a little more about what happened.',
  e4:'Please tap one answer.', e4name:'Please type your name.', e4contact:'Please type your phone number (or an email).', e4email:'This email does not look right.', e4phone:'This phone number looks too short.',
  e5:'Please tick the box above.', eT:'Please type both numbers.',
  errPhoto:'This photo could not be used. Please try another photo.',
  errSend:'Your complaint could not be sent. Please check your internet and press Send again. What you wrote is saved on this phone.',
  errServer:'The complaint could not be saved: ',
  draftRestored:'We kept what you wrote earlier.', clearDraft:'Start again',
  demo:'DEMO MODE: for practice and training only. Complaints are not sent to the Ministry.',
  notConnected:'Not connected yet. TSIMU: paste the Public intake link into SCRIPT_URL.',
  errNotConnected:'This page is not connected to the Ministry yet. Please ask an MOE officer to log your complaint, or call {phone}.',
  help:'Need help? Call {phone} or email {email}.',

 }
};

/* ---------------- helpers ---------------- */
let LANG = 'en';
const DEMO = BUILD === 'demo';
const CONNECTED = /^https:\/\/script\.google\.com\/.+\/exec$/.test(CONFIG.SCRIPT_URL.trim());
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
function t(k, v){ let s = (TEXT[LANG] && TEXT[LANG][k]) || TEXT.en[k] || k; if (v) for (const x in v) s = s.split('{' + x + '}').join(v[x]); return s; }
/* Category, office and section names come from the Sheet in English. A Gilbertese name can be added as TEXT.gil['name:English name']. */
const tr = v => (TEXT[LANG] && TEXT[LANG]['name:' + v]) || v;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function store(){ try { return window.localStorage; } catch(e){ return null; } }
function sGet(k){ try { const v = store() && store().getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } }
function sSet(k, v){ try { store() && store().setItem(k, JSON.stringify(v)); } catch(e){} }
function sDel(k){ try { store() && store().removeItem(k); } catch(e){} }
const digits = s => String(s || '').replace(/\D/g, '');

/* answers kept here */
const A = { place:'', school:'', section:'', other:'', category:'', mode:'' };
let photo = null, step = 0;
const SCHOOL = '__school', OTHER = '__other';

function applyText(){
  $$('[data-t]').forEach(el => el.textContent = t(el.dataset.t));
  $('#helpLine').textContent = t('help', {phone: CONFIG.HELP_PHONE, email: CONFIG.HELP_EMAIL});
  $('#helpHome').textContent = t('homeHelp', {phone: CONFIG.HELP_PHONE});
  $('#backBtn').textContent = '‹ ' + t('back'); $('#trackBack').textContent = '‹ ' + t('back');
  $('#photoBtnTxt').textContent = photo ? t('photoChange') : t('photoAdd');
  document.documentElement.lang = LANG === 'gil' ? 'gil' : 'en';
  if (TEXT.gil){ $('#langRow').hidden = false; $('#langBtn').textContent = LANG === 'en' ? t('langOther') : 'English'; }
  buildOptions();
  if (step) showStep(step, true);
}
function optBtn(val, label, sub, cur){ return '<button type="button" class="opt" data-val="' + esc(val) + '" aria-pressed="' + (cur === val) + '"><span class="dot"></span><span>' + esc(label) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span></button>'; }
function buildOptions(){
  $('#placeOpts').innerHTML = OFFICES.map(o => optBtn(o, tr(o), '', A.place)).join('') + optBtn(SCHOOL, t('school'), t('schoolSub'), A.place) + optBtn(OTHER, t('other'), '', A.place);
  $('#catOpts').innerHTML = CATEGORIES.map(c => optBtn(c, tr(c), '', A.category)).join('');
  $('#school').innerHTML = '<option value="">' + esc(t('chooseSchool')) + '</option>' + SCHOOLS.map(s => '<option>' + esc(s) + '</option>').join('') + '<option value="' + esc(t('notInList')) + '">' + esc(t('notInList')) + '</option>';
  $('#section').innerHTML = '<option value="">' + esc(t('dontKnow')) + '</option>' + SECTIONS.map(s => '<option value="' + esc(s) + '">' + esc(tr(s)) + '</option>').join('');
  $('#school').value = A.school; $('#section').value = A.section;
  $$('#placeOpts .opt').forEach(b => b.onclick = () => { A.place = b.dataset.val; pressed('#placeOpts', b); showMore(); hideErr(1); save(); });
  $$('#catOpts .opt').forEach(b => b.onclick = () => { A.category = b.dataset.val; pressed('#catOpts', b); hideErr(2); save(); });
  $$('.opt[data-mode]').forEach(b => { b.setAttribute('aria-pressed', A.mode === b.dataset.mode); b.onclick = () => { A.mode = b.dataset.mode; $$('.opt[data-mode]').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#namedBox').hidden = A.mode !== 'named'; hideErr(4); save(); if (A.mode === 'named') setTimeout(() => $('#name').focus(), 50); }; });
  $('#namedBox').hidden = A.mode !== 'named';
  showMore();
}
function pressed(root, b){ $$(root + ' .opt').forEach(x => x.setAttribute('aria-pressed', x === b)); }
function showMore(){
  $('#schoolBox').hidden = A.place !== SCHOOL;
  $('#sectionBox').hidden = A.place !== OFFICES[0];
  $('#otherBox').hidden = A.place !== OTHER;
}
function showErr(n, msg){ const e = $('#err' + n); e.textContent = msg; e.hidden = false; e.scrollIntoView({behavior:'smooth', block:'center'}); }
function hideErr(n){ const e = $('#err' + n); if (e) e.hidden = true; }

/* ---------------- screens ---------------- */
function screen(name){
  $('#s-home').hidden = name !== 'home'; $('#f').hidden = name !== 'form'; $('#s-done').hidden = name !== 'done'; $('#s-track').hidden = name !== 'track';
  window.scrollTo(0, 0);
}
function showStep(n, quiet){
  step = n; screen('form');
  $$('section[data-step]').forEach(s => s.hidden = Number(s.dataset.step) !== n);
  $('#stepNo').textContent = t('step', {n: n}); $('#barFill').style.width = (n * 20) + '%';
  if (n === 5) buildReview();
  if (!quiet) window.scrollTo(0, 0);
}
$('#goMake').onclick = () => showStep(1);
$('#goTrack').onclick = () => screen('track');
$('#trackBack').onclick = () => screen('home');
$('#backBtn').onclick = () => step > 1 ? showStep(step - 1) : (step = 0, screen('home'));
$$('[data-next]').forEach(b => b.onclick = () => { if (check(step)) showStep(Number(b.dataset.next)); });

function placeText(){
  if (A.place === SCHOOL) return t('school') + ': ' + A.school;
  if (A.place === OTHER) return A.other || t('other');
  return A.place;
}
function check(n){
  if (n === 1){
    if (!A.place) return showErr(1, t('e1')), false;
    if (A.place === SCHOOL && !A.school) return showErr(1, t('e1s')), false;
  }
  if (n === 2 && !A.category) return showErr(2, t('e2')), false;
  if (n === 3 && $('#details').value.trim().length < 10) return showErr(3, t('e3')), false;
  if (n === 4){
    if (!A.mode) return showErr(4, t('e4')), false;
    if (A.mode === 'named'){
      const nm = $('#name').value.trim(), ph = $('#phone').value.trim(), em = $('#email').value.trim();
      if (nm.length < 2) return showErr(4, t('e4name')), false;
      if (!ph && !em) return showErr(4, t('e4contact')), false;
      if (ph && digits(ph).length < 5) return showErr(4, t('e4phone')), false;
      if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return showErr(4, t('e4email')), false;
    }
  }
  if (n === 5 && !$('#consent').checked) return showErr(5, t('e5')), false;
  hideErr(n); return true;
}
$('#school').onchange = () => { A.school = $('#school').value; hideErr(1); save(); };
$('#section').onchange = () => { A.section = $('#section').value; save(); };
$('#otherPlace').oninput = () => { A.other = $('#otherPlace').value.trim(); save(); };
$('#details').oninput = () => { hideErr(3); save(); };
['#name','#phone','#email'].forEach(id => $(id).oninput = () => { hideErr(4); save(); });
$('#consent').onchange = () => hideErr(5);

function buildReview(){
  const rows = [[t('r_where'), (A.place === SCHOOL || A.place === OTHER ? placeText() : tr(A.place)) + (A.place === OFFICES[0] && A.section ? ', ' + tr(A.section) : '')], [t('r_about'), tr(A.category)], [t('r_what'), $('#details').value.trim()]];
  rows.push([t('r_contact'), A.mode === 'anon' ? t('r_anon') : [$('#name').value.trim(), $('#phone').value.trim(), $('#email').value.trim()].filter(Boolean).join('\n')]);
  if (photo) rows.push([t('r_photo'), t('r_photoYes')]);
  $('#review').innerHTML = rows.map(r => '<div><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>').join('');
}

/* ---------------- photo (made smaller on the phone before sending) ---------------- */
function compressImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1280; let w = img.naturalWidth, h = img.naturalHeight; const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); const data = c.toDataURL('image/jpeg', 0.72);
      resolve({ name: (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data: data.split(',')[1], preview: data });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
$('#photo').onchange = async e => {
  const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
  try { photo = await compressImage(file); $('#photoPrev').src = photo.preview; $('#photoPrev').hidden = false; $('#photoRemove').hidden = false; $('#photoBtnTxt').textContent = t('photoChange'); hideErr(3); }
  catch(err){ photo = null; showErr(3, t('errPhoto')); }
};
$('#photoRemove').onclick = () => { photo = null; $('#photoPrev').hidden = true; $('#photoRemove').hidden = true; $('#photoBtnTxt').textContent = t('photoAdd'); };

/* ---------------- what you typed is kept on this phone ---------------- */
const DRAFT = 'moe_cr_draft2';
let dTimer = null;
function save(){ clearTimeout(dTimer); dTimer = setTimeout(() => sSet(DRAFT, Object.assign({}, A, { details: $('#details').value, name: $('#name').value, phone: $('#phone').value, email: $('#email').value })), 300); }
function restore(){
  const d = sGet(DRAFT); if (!d || !(d.details || d.place || d.category)) return;
  ['place','school','section','other','category','mode'].forEach(k => A[k] = d[k] || '');
  $('#details').value = d.details || ''; $('#name').value = d.name || ''; $('#phone').value = d.phone || ''; $('#email').value = d.email || ''; $('#otherPlace').value = A.other;
  $('#draftNote').hidden = false;
}
function reset(){
  Object.keys(A).forEach(k => A[k] = ''); photo = null; $('#f').reset(); $('#photoPrev').hidden = true; $('#photoRemove').hidden = true;
  sDel(DRAFT); $('#draftNote').hidden = true; $('#sendErr').hidden = true; $$('.err').forEach(e => e.hidden = true); applyText();
}
$('#clearDraft').onclick = () => { reset(); showStep(1); };

/* ---------------- send to the Ministry ---------------- */
async function callScript(payload, ms){
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), ms || 60000);
  try { const r = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload), signal: ctl.signal }); return await r.json(); }   // plain text body, no preflight
  finally { clearTimeout(tm); }
}
function demoSubmit(p){
  return new Promise(res => setTimeout(() => {
    const list = sGet('moe_cr_demo') || [];
    const ref = 'CMP-' + new Date().getFullYear() + '-' + String(101 + list.length).padStart(4, '0'), pin = String(Math.floor(1000 + Math.random() * 9000));
    list.push({ ref: ref, pin: pin, submitted: new Date().toISOString(), category: p.category, place: p.place, section: p.section, details: p.details, summary: p.details.slice(0, 80),
      name: p.name, phone: p.phone, email: p.email, priority: URGENT_CATEGORIES.indexOf(p.category) > -1 ? 'High' : 'Medium', status: 'New' });
    sSet('moe_cr_demo', list); res({ ok: true, ref: ref, pin: pin });
  }, 900));
}
function codeOK(c, code){ code = String(code).trim(); if (code === c.pin) return true; if (c.email && code.toLowerCase() === c.email.toLowerCase()) return true; const d = digits(code), p = digits(c.phone); return d.length >= 4 && p.length >= 4 && p.slice(-d.length) === d; }
function demoTrack(ref, code){ return new Promise(res => setTimeout(() => { const c = (sGet('moe_cr_demo') || []).find(x => x.ref === ref); res(c && codeOK(c, code) ? { ok: true, ref: c.ref, submitted: c.submitted.slice(0, 10), category: c.category, status: c.status, updates: [] } : { ok: false, notFound: true }); }, 600)); }
function normRef(s){ const d = digits(s); return d.length < 5 ? String(s || '').trim().toUpperCase() : 'CMP-' + d.slice(0, 4) + '-' + String(Number(d.slice(4))).padStart(4, '0'); }

$('#f').onsubmit = async e => {
  e.preventDefault();
  for (let n = 1; n <= 4; n++) if (!check(n)) return showStep(n);
  if (!check(5)) return;
  const btn = $('#sendBtn'); btn.disabled = true; btn.textContent = t('sending'); $('#sendErr').hidden = true;
  const anon = A.mode === 'anon';
  const p = { action: 'submit', anonymous: anon ? 'Yes' : 'No', name: anon ? '' : $('#name').value.trim(), phone: anon ? '' : $('#phone').value.trim(), email: anon ? '' : $('#email').value.trim(),
    place: placeText(), section: A.place === OFFICES[0] ? A.section : '', category: A.category, details: $('#details').value.trim(),
    consent: 'Yes', website: $('#website').value, lang: LANG, photo: photo ? { name: photo.name, type: photo.type, data: photo.data } : null };
  try {
    if (!DEMO && !CONNECTED) throw new Error(t('errServer') + t('errNotConnected', {phone: CONFIG.HELP_PHONE}).replace(t('errServer'), ''));
    const r = DEMO ? await demoSubmit(p) : await callScript(p);
    if (!r || !r.ok) throw new Error(r && r.error ? t('errServer') + r.error : t('errSend'));
    sDel(DRAFT);
    $('#doneRef').textContent = r.ref; $('#donePin').textContent = r.pin; screen('done');
  } catch(err){ const b = $('#sendErr'); b.textContent = err && err.message && err.message.indexOf(t('errServer')) === 0 ? err.message : t('errSend'); b.hidden = false; }
  finally { btn.disabled = false; btn.textContent = t('send'); }
};
$('#doneHome').onclick = () => { reset(); step = 0; screen('home'); };

/* ---------------- check my complaint ---------------- */
const LEVEL = { 'New':1, 'Acknowledged':2, 'Assigned':3, 'In progress':3, 'Resolved':4, 'Closed':4 };
$('#tf').onsubmit = async e => {
  e.preventDefault();
  const ref = normRef($('#tref').value), code = $('#tcode').value.trim();
  if (!ref || !code){ const x = $('#errT'); x.textContent = t('eT'); x.hidden = false; return; }
  $('#errT').hidden = true; $('#tref').value = ref; $('#trackOut').hidden = true;
  const btn = $('#trackBtn'); btn.disabled = true;
  try {
    if (!DEMO && !CONNECTED){ const x = $('#errT'); x.textContent = t('errNotConnected', {phone: CONFIG.HELP_PHONE}); x.hidden = false; return; }
    const r = DEMO ? await demoTrack(ref, code) : await callScript({ action: 'track', ref: ref, code: code }, 30000);
    if (!r || !r.ok){ const x = $('#errT'); x.textContent = r && r.busy ? t('trackBusy') : t('trackNotFound'); x.hidden = false; return; }
    const lvl = LEVEL[r.status] || 1, done = r.status === 'Resolved' || r.status === 'Closed';
    const ups = (r.updates || []).map(u => '<li><small>' + esc(u.date) + '</small>' + esc(u.message) + '</li>').join('');
    $('#trackOut').innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><b style="font-size:20px;color:var(--navy);font-family:Courier New,monospace">' + esc(r.ref) +
      '</b><span class="chip' + (done ? ' ok' : '') + '">' + esc(t('st_' + r.status)) + '</span></div><ol class="prog">' + [1,2,3,4].map(i => '<li class="' + (i <= lvl ? 'on' : '') + '"><i></i>' + esc(t('p' + i)) + '</li>').join('') +
      '</ol><p style="margin:6px 0">' + esc(t('submitted')) + ': <b>' + esc(r.submitted) + '</b><br>' + esc(t('aboutLbl')) + ': <b>' + esc(r.category) + '</b></p><b>' + esc(t('updates')) + '</b>' +
      (ups ? '<ul class="updates">' + ups + '</ul>' : '<p class="hint" style="margin-top:6px">' + esc(t('noUpdates')) + '</p>');
    $('#trackOut').hidden = false; $('#trackOut').scrollIntoView({behavior:'smooth', block:'start'});
  } catch(err){ const x = $('#errT'); x.textContent = t('errSend').split('.')[0] + '.'; x.hidden = false; }
  finally { btn.disabled = false; }
};

/* ---------------- language ---------------- */
$('#langBtn').onclick = () => { LANG = LANG === 'en' ? 'gil' : 'en'; sSet('moe_cr_lang', LANG); applyText(); };

/* ---------------- start ---------------- */
(function init(){
  const saved = sGet('moe_cr_lang'); if (saved && TEXT[saved]) LANG = saved;
  $('#demoBanner').hidden = !(DEMO || !CONNECTED);
  $('#demoBanner').classList.toggle('off', !DEMO && !CONNECTED);
  $('#demoText').textContent = DEMO ? t('demo') : t('notConnected');
  restore(); applyText();
  if (location.hash === '#track') screen('track'); else screen('home');
  if (!DEMO && CONNECTED){
    const ctl = new AbortController(); setTimeout(() => ctl.abort(), 8000);
    fetch(CONFIG.SCRIPT_URL + '?action=config', { signal: ctl.signal }).then(r => r.json()).then(c => {
      if (!c || !c.ok) return;
      if (Array.isArray(c.categories) && c.categories.length) CATEGORIES = c.categories;
      if (Array.isArray(c.offices) && c.offices.length) OFFICES = c.offices;
      if (c.helpPhone) CONFIG.HELP_PHONE = c.helpPhone; if (c.helpEmail) CONFIG.HELP_EMAIL = c.helpEmail;
      applyText();
    }).catch(() => {});
  }
})();
</script>
